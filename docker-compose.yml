# Local development only — production uses Neon + Upstash on Vercel.
# Brings up PostgreSQL 16 and Redis 7 for offline dev.
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: craftpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: craftpulse
      POSTGRES_PASSWORD: craftpulse
      POSTGRES_DB: craftpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftpulse -d craftpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: craftpulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: serverless Redis adapter (Upstash REST proxy locally) — uncomment if needed
  # upstash-redis:
  #   image: hiett/serverless-redis-http:latest
  #   ports: ["8079:80"]
  #   environment:
  #     SRH_MODE: env
  #     SRH_TOKEN: craftpulse_dev_token
  #     SRH_CONNECTION_STRING: redis://redis:6379
  #   depends_on: [redis]

volumes:
  postgres-data:
  redis-data:
